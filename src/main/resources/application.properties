# ==============================================================================
# FinAI Application Configuration
# Hardware Profile: Optimized for 4GB RAM System
# ==============================================================================

spring.application.name=FinAI
server.port=${PORT:8080}

# ==============================================================================
# H2 Embedded Database Configuration
# Uses lightweight file-based persistence under ./data/finaidb
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/finaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (available at http://localhost:8080/h2-console for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================================================================
# AI Provider Configuration
# ==============================================================================
finai.ai.provider=${AI_PROVIDER:gemini}
finai.ai.gemini.api-key=${GEMINI_API_KEY:}
finai.ai.gemini.model=gemini-1.5-flash

# ==============================================================================
# Logging Configuration (Minimizes memory and disk I/O)
# ==============================================================================
logging.level.root=INFO
logging.level.com.finai=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
